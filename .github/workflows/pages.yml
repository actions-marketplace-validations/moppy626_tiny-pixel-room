name: 設定サイト

# site/ の設定サイトを GitHub Pages に公開する。
# 初めて使う前に、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく。
on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/**
      - fonts/**
      - scripts/build-site.mjs
      - package.json
      - package-lock.json
      - THIRD_PARTY_LICENSES.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

# サイトを書き換えられる権限は、公開する deploy ジョブだけに付ける。
# build ジョブは npm の依存パッケージを動かすので、読み取りだけにしておく。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# 使う Action は、タグの付け替えの影響を受けないようコミット SHA で指定する。更新は Dependabot が PR で知らせる。
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
